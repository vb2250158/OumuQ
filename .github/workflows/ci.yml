name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: py -X utf8 -m pip install -e .[dev]
      - name: Ruff
        run: py -X utf8 -m ruff check .
      - name: Pytest
        run: py -X utf8 -m pytest
