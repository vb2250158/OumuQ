[project]
name = "oumuq"
version = "0.2.1"
description = "Local Web GUI and router for character TTS workers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
onnx-vits = [
  "numpy>=1.24,<2",
  "onnxruntime>=1.16,<2",
  "cn2an>=0.5,<1",
  "pypinyin>=0.50,<1",
  "pyopenjtalk-prebuilt>=0.3,<1",
  "Unidecode>=1.3,<2",
  "inflect>=7,<8",
  "eng-to-ipa>=0.0.2,<1",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".git", ".venv", "cache", "runs"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*", "static/*", "workers/onnx_vits/THIRD_PARTY_LICENSES.md"]
